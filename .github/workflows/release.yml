name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the bundle version
        run: |
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("fedr.me keyboard.bundle/Contents/Info.plist", "rb"))["CFBundleVersion"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleVersion $version"
            exit 1
          fi

      - name: Pack the bundle
        run: zip -r -X fedr.me-keyboard.zip "fedr.me keyboard.bundle"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fedr.me-keyboard.zip \
            --title "fedr.me keyboard $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
